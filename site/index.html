<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rookery — Learn Chess Openings for Free</title>
  <meta name="description" content="Learn chess openings the easy way. Pick an opening, play the moves with your coach, and practice until you know them. Free, no sign-up.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc93c'/%3E%3Cpath d='M18 50h28v-6l-4-3V26l4-4v-8h-6v4h-4v-4h-8v4h-4v-4h-6v8l4 4v15l-4 3z' fill='%232a1f00'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="Rookery home">
      <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><path d="M18 52h28v-6l-4-3V27l4-4V13h-6v4h-4v-4h-8v4h-4v-4h-6v10l4 4v16l-4 3z" fill="currentColor"/></svg>
      <span>Rookery</span>
    </a>
    <nav id="nav" aria-label="Main">
      <a href="#/" data-nav="home">Openings</a>
      <a href="#/against" data-nav="crush">Play against</a>
      <a href="#/review" data-nav="review">Practice <i id="dueBadge" hidden></i></a>
    </nav>
    <div class="top-r">
      <span class="pill" id="streak" title="Days in a row">🔥 <b>0</b></span>
      <details class="more" id="moreMenu">
        <summary aria-label="More"><span aria-hidden="true">⋯</span></summary>
        <div class="menu">
          <a href="#/explorer">Try any moves<small>See which opening your moves make</small></a>
          <a href="#/import">Add your own games<small>Import PGN files</small></a>
          <a href="#/stats">My progress</a>
          <div class="boards" id="boards" role="group" aria-label="Board colors">
            <span>Board</span>
            <button type="button" data-board="blue" aria-label="Blue board" style="--l:#e6edf3;--d:#7d9db8"></button>
            <button type="button" data-board="green" aria-label="Green board" style="--l:#eeeed2;--d:#769656"></button>
            <button type="button" data-board="brown" aria-label="Brown board" style="--l:#f0d9b5;--d:#b58863"></button>
          </div>
          <button id="themeBtn" type="button">Switch light or dark</button>
        </div>
      </details>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    Opening names and lines from <a href="https://github.com/lichess-org/chess-openings">lichess-org/chess-openings</a> (CC0). Pieces by cburnett. Free forever. Everything stays in your browser.
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
